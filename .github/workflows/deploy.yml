name: Deploy to Cloudflare Pages

# Deploys the VIMS Phase 1 app to Cloudflare Pages on every push to main.
# The source of truth is this GitHub repo — Cloudflare is deployed *from* GitHub,
# not by running wrangler manually from a laptop.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: e19974cc71177aa1f76d7e90e0a48f6c
          command: pages deploy . --project-name=vims-app --branch=main --commit-dirty=true
